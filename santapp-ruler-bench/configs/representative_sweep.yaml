base_config: configs/default_8k.yaml
output_root: runs/sweeps/team-sampler-sweep
name_template: "P{parent_size}-R{representatives_per_parent}-S{samples_per_head}"

grid:
  # Specify which backend variant to target
  generation.backends:
    - [team_gumbel_topk]

  santapp_variants.team_gumbel_topk.parent_size: [32, 64]
  # Sweep R (representatives_per_parent)
  santapp_variants.team_gumbel_topk.representatives_per_parent: [8]