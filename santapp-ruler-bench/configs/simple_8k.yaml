# Standard small comparison for routine group-policy checks:
# 20 NIAH multivalue prompts + 20 QA-1 prompts, using official token limits.
benchmark:
  context_length: 8192
  tasks: [niah_multivalue, qa_1]
  prompts_per_task: 20
  selection_seed: 42

generation:
  backends: [sdpa, santa, santapp]
  stop_on_eos: true
  max_new_tokens: null
  random_seed: 0

santa:
  samples_per_head: 128

santapp:
  group_size: 16
  samples_per_head: 128
  probe_queries: 64

output:
  root: runs
  run_name: simple-8k
  resume: true
