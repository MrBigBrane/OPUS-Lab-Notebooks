# The ordinary command runs exactly one configuration. No sweep is implicit.
model:
  name: Qwen/Qwen2.5-3B-Instruct
  revision: aa8e72537993ba99e69dfaafa59ed015b17504d1
  dtype: float16
  device: cuda
  attn_implementation: sdpa
  trust_remote_code: false
  disable_hf_xet: true

benchmark:
  # RULER's max sequence length includes the prompt and generation budget.
  context_length: 8192
  # Representative subset spanning retrieval, tracking, aggregation, and QA.
  tasks:
    - niah_single_1
    - niah_multikey_1
    - niah_multiquery
    - vt
    - fwe
    - qa_1
  prompts_per_task: 5
  selection_seed: 42
  data:
    # Pinned 8k convenience mirror generated with the Qwen2.5-3B tokenizer.
    # Set source: local to use JSONL generated directly by NVIDIA/RULER.
    source: huggingface
    repository: SaylorTwift/RULER-8192-Qwen2.5-3B-tokenizer
    revision: 6ee2d0f4e9b8983361da35204ead8931c3f65ad4
    local_root: null
    subset: validation

generation:
  # Add `santa` here or use --backends sdpa,santa,santapp for all methods.
  backends: [sdpa, santapp]
  stop_on_eos: true
  # null uses each task's own RULER generation limit.
  max_new_tokens: null
  random_seed: 0

santa:
  # Per-query-head IID sample budget. SANTA has no exact recent window.
  samples_per_head: 128

santapp:
  group_size: 16
  samples_per_head: 128
  # The final P prompt tokens are used directly as probe queries.
  probe_queries: 64
  # The fixed exact prompt-tail window is always zero. Every prompt token,
  # including the re-fed final token, is cluster-covered. Only generated tokens
  # remain outside the frozen clusters as a growing exact suffix.
  kmeans:
    batch_size: 4096
    n_init: 1
    max_iter: 100
    tol: 0.0
    max_no_improvement: 10
    init_size: null
    reassignment_ratio: 0.01
    random_state: 0

output:
  root: runs
  run_name: null
  resume: true
  save_full_prompts: true
