# Small local comparison of every standard attention backend.
model:
  name: Qwen/Qwen2.5-3B-Instruct
  revision: aa8e72537993ba99e69dfaafa59ed015b17504d1
  dtype: float16
  device: cuda
  attn_implementation: sdpa
  trust_remote_code: false
  disable_hf_xet: true

benchmark:
  context_length: 8192
  tasks: [niah_multiquery, niah_multivalue]
  prompts_per_task: 5
  selection_seed: 42
  data:
    source: huggingface
    repository: SaylorTwift/RULER-8192-Qwen2.5-3B-tokenizer
    revision: 6ee2d0f4e9b8983361da35204ead8931c3f65ad4
    local_root: null
    subset: validation

generation:
  backends:
    # - sdpa
    # - santa
    # - santapp
    # - santapp_gumbel_topk
    # - team_sampler
    - team_gumbel_topk
  stop_on_eos: true
  # null uses the official generation budget for each RULER task.
  max_new_tokens: null
  random_seed: 0

santa:
  samples_per_head: 128

# SANTA++ defaults to B=16. Every prompt token is assigned to the frozen
# partition; only subsequently generated tokens form the exact suffix.
santapp:
  mode: guided
  group_size: 16
  parent_size: 16
  representatives_per_parent: 4
  samples_per_head: 128
  probe_queries: 64
  kmeans:
    batch_size: 4096
    n_init: 1
    max_iter: 100
    tol: 0.0
    max_no_improvement: 10
    init_size: null
    reassignment_ratio: 0.01
    random_state: 0

# Each named method inherits the full santapp block before applying overrides.
santapp_variants:
  santapp_gumbel_topk:
    mode: gumbel_cluster
    group_size: 16
    samples_per_head: 128
  team_sampler:
    mode: team_sampler
    parent_size: 16
    representatives_per_parent: 4
    samples_per_head: 128
  team_gumbel_topk:
    mode: team_gumbel_topk
    parent_size: 16
    representatives_per_parent: 4
    samples_per_head: 128

grading:
  bootstrap_resamples: 10000
  confidence_level: 0.95
  bootstrap_seed: 20260805

output:
  root: runs
  run_name: null
  resume: true
  save_full_prompts: true
  save_prediction_inputs: true
