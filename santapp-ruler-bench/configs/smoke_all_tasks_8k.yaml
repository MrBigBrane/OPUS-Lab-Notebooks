# Requested handoff smoke matrix: 3 methods x 13 tasks x 1 prompt = 39 rows.
# Uses each task's official RULER generation limit.
benchmark:
  context_length: 8192
  tasks:
    - niah_single_1
    - niah_single_2
    - niah_single_3
    - niah_multikey_1
    - niah_multikey_2
    - niah_multikey_3
    - niah_multivalue
    - niah_multiquery
    - vt
    - cwe
    - fwe
    - qa_1
    - qa_2
  prompts_per_task: 1
  selection_seed: 42

generation:
  backends: [sdpa, santa, santapp]
  stop_on_eos: true
  max_new_tokens: null
  random_seed: 0

santa:
  samples_per_head: 128

santapp:
  group_size: 16
  samples_per_head: 128
  probe_queries: 64

output:
  root: runs
  run_name: smoke-all-tasks-8k
  resume: true
