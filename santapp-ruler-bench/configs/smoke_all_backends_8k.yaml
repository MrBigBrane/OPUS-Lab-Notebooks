# Execution smoke: one prompt through every standard attention backend.
benchmark:
  context_length: 8192
  tasks: [niah_multiquery]
  prompts_per_task: 1
  selection_seed: 42

generation:
  backends:
    - sdpa
    - santa
    - santapp
    - santapp_gumbel_topk
    - team_sampler
    - team_gumbel_topk
  stop_on_eos: true
  max_new_tokens: 4
  random_seed: 0

santa:
  samples_per_head: 128

santapp:
  mode: guided
  group_size: 16
  parent_size: 16
  representatives_per_parent: 4
  samples_per_head: 128
  probe_queries: 64

santapp_variants:
  santapp_gumbel_topk:
    mode: gumbel_cluster
    group_size: 16
    samples_per_head: 128
  team_sampler:
    mode: team_sampler
    parent_size: 16
    representatives_per_parent: 4
    samples_per_head: 128
  team_gumbel_topk:
    mode: team_gumbel_topk
    parent_size: 16
    representatives_per_parent: 4
    samples_per_head: 128

output:
  root: runs
  run_name: smoke-all-backends-8k
  resume: true
  save_full_prompts: false
  save_prediction_inputs: false
