# Fast plumbing smoke test. The 8-token override is not a standard RULER run.
benchmark:
  context_length: 8192
  tasks: [niah_multivalue, qa_1]
  prompts_per_task: 1
  selection_seed: 42

generation:
  backends: [sdpa, santa, santapp]
  stop_on_eos: true
  max_new_tokens: 8
  random_seed: 0

santa:
  samples_per_head: 128

santapp:
  group_size: 16
  samples_per_head: 128
  probe_queries: 64

output:
  root: runs
  run_name: smoke-quick
  resume: true
