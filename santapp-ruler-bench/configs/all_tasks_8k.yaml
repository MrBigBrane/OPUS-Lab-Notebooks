# Full 13-task profile. Reduce prompts_per_task for exploratory runs.
benchmark:
  context_length: 8192
  tasks:
    - niah_single_1
    - niah_single_2
    - niah_single_3
    - niah_multikey_1
    - niah_multikey_2
    - niah_multikey_3
    - niah_multivalue
    - niah_multiquery
    - vt
    - cwe
    - fwe
    - qa_1
    - qa_2
  prompts_per_task: 500

generation:
  backends:
    - sdpa
    - santa
    - santapp
    - santapp_gumbel_topk
    - team_sampler
    - team_gumbel_topk
  stop_on_eos: true
  max_new_tokens: null
  random_seed: 0

santa:
  samples_per_head: 128

santapp:
  mode: guided
  group_size: 16
  parent_size: 16
  representatives_per_parent: 4
  samples_per_head: 128
  probe_queries: 64

santapp_variants:
  santapp_gumbel_topk:
    mode: gumbel_cluster
    group_size: 16
    samples_per_head: 128
  team_sampler:
    mode: team_sampler
    parent_size: 16
    representatives_per_parent: 4
    samples_per_head: 128
  team_gumbel_topk:
    mode: team_gumbel_topk
    parent_size: 16
    representatives_per_parent: 4
    samples_per_head: 128
