# configs/full_n_init_sweep.yaml
base_config: "configs/all_tasks_8k.yaml"
output_root: "/workspace/runs/full-n-init-sweep"
name_template: "{task}_n_init_{n_init}"

grid:
  benchmark.prompts_per_task: [30]
  
  # Each item is passed as a list of 1 task so the parser receives a list format
  benchmark.tasks:
    - [cwe]
    - [niah_multikey_1]
    - [qa_1]

  santapp.probe_queries: [64]
  santapp.probe_strategy: [end]
  santapp.samples_per_head: [128]
  santapp.kmeans.n_init: [1, 2, 4]