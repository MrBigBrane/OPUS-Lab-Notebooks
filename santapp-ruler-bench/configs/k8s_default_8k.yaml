# Base config for the checked-in indexed Kubernetes matrix. The indexed worker
# narrows this to exactly one task and one method per completion.
model:
  name: Qwen/Qwen2.5-3B-Instruct
  revision: aa8e72537993ba99e69dfaafa59ed015b17504d1
  dtype: float16
  device: cuda
  attn_implementation: sdpa
  trust_remote_code: false
  disable_hf_xet: true

benchmark:
  context_length: 8192
  tasks: [niah_multiquery, niah_multivalue]
  prompts_per_task: 100
  selection_seed: 42
  data:
    source: huggingface
    repository: SaylorTwift/RULER-8192-Qwen2.5-3B-tokenizer
    revision: 6ee2d0f4e9b8983361da35204ead8931c3f65ad4
    local_root: null
    subset: validation

generation:
  # Replaced by each matrix work item.
  backends: [sdpa]
  stop_on_eos: true
  max_new_tokens: null
  random_seed: 0

santa:
  samples_per_head: 128

santapp:
  mode: guided
  group_size: 16
  parent_size: 16
  representatives_per_parent: 4
  samples_per_head: 128
  probe_queries: 64
  kmeans:
    batch_size: 4096
    n_init: 1
    max_iter: 100
    tol: 0.0
    max_no_improvement: 10
    init_size: null
    reassignment_ratio: 0.01
    random_state: 0

santapp_variants:
  santapp_gumbel_topk:
    mode: gumbel_cluster
    group_size: 16
    samples_per_head: 128
  team_sampler:
    mode: team_sampler
    parent_size: 16
    representatives_per_parent: 4
    samples_per_head: 128
  team_gumbel_topk:
    mode: team_gumbel_topk
    parent_size: 16
    representatives_per_parent: 4
    samples_per_head: 128

grading:
  bootstrap_resamples: 10000
  confidence_level: 0.95
  bootstrap_seed: 20260805

output:
  root: /mnt/results/yourname-santapp-ruler
  run_name: null
  resume: true
  save_full_prompts: false
  save_prediction_inputs: false
