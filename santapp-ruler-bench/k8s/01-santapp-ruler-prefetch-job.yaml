apiVersion: batch/v1
kind: Job
metadata:
  name: yourname-santapp-ruler-prefetch
  namespace: ucsb-opus-lab
  labels:
    app.kubernetes.io/name: yourname-santapp-ruler
    app.kubernetes.io/component: prefetch
    app.kubernetes.io/part-of: santapp-ruler-default-2tasks-6methods-100p-8k
    owner: yourname
spec:
  backoffLimit: 3
  ttlSecondsAfterFinished: 604800
  template:
    metadata:
      labels:
        app.kubernetes.io/name: yourname-santapp-ruler
        app.kubernetes.io/component: prefetch
        app.kubernetes.io/part-of: santapp-ruler-default-2tasks-6methods-100p-8k
        owner: yourname
    spec:
      restartPolicy: Never
      terminationGracePeriodSeconds: 60
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      initContainers:
        - name: prepare-results-permissions
          image: your-registry/santapp-ruler:latest
          imagePullPolicy: Always
          command: [/bin/bash, -lc]
          args:
            - |
              set -euo pipefail
              mkdir -p /mnt/results/yourname-santapp-ruler
              chown 10001:10001 /mnt/results/yourname-santapp-ruler
              chmod 2775 /mnt/results/yourname-santapp-ruler
          securityContext:
            runAsNonRoot: false
            runAsUser: 0
            runAsGroup: 0
            allowPrivilegeEscalation: false
          volumeMounts:
            - name: results-vol
              mountPath: /mnt/results
      containers:
        - name: prefetch
          image: your-registry/santapp-ruler:latest
          imagePullPolicy: Always
          command: [python, /workspace/scripts/k8s_prefetch.py]
          args:
            - --matrix
            - /workspace/k8s/matrices/default-2tasks-6methods-100p-8k.yaml
            - --results-root
            - /mnt/results/yourname-santapp-ruler
          env:
            - name: RESULTS_ROOT
              value: /mnt/results/yourname-santapp-ruler
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
            - name: HF_TOKEN
              valueFrom:
                secretKeyRef:
                  name: hf-token
                  key: HF_TOKEN
                  optional: true
            - name: TOKENIZERS_PARALLELISM
              value: "false"
          resources:
            requests:
              cpu: "2"
              memory: 6Gi
              ephemeral-storage: 4Gi
            limits:
              cpu: "2"
              memory: 6Gi
              ephemeral-storage: 4Gi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
          volumeMounts:
            - name: results-vol
              mountPath: /mnt/results
      volumes:
        - name: results-vol
          persistentVolumeClaim:
            claimName: yourname-santapp-ruler-rwx
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: kubernetes.io/arch
                    operator: In
                    values: [amd64]
                  - key: topology.kubernetes.io/region
                    operator: In
                    values: [us-west]
