apiVersion: batch/v1
kind: Job
metadata:
  name: yourname-santapp-ruler-smoke
  namespace: ucsb-opus-lab
  labels:
    app.kubernetes.io/name: yourname-santapp-ruler
    app.kubernetes.io/component: smoke
    app.kubernetes.io/part-of: santapp-ruler-default-2tasks-6methods-100p-8k
    owner: yourname
spec:
  backoffLimit: 1
  ttlSecondsAfterFinished: 604800
  template:
    metadata:
      labels:
        app.kubernetes.io/name: yourname-santapp-ruler
        app.kubernetes.io/component: smoke
        app.kubernetes.io/part-of: santapp-ruler-default-2tasks-6methods-100p-8k
        owner: yourname
    spec:
      restartPolicy: Never
      terminationGracePeriodSeconds: 120
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: smoke
          image: your-registry/santapp-ruler:latest
          imagePullPolicy: Always
          command: [python, -m, santapp_ruler, run]
          args:
            - --config
            - /workspace/configs/smoke_all_backends_8k.yaml
            - --run-dir
            - /mnt/results/yourname-santapp-ruler/santapp-ruler-default-2tasks-6methods-100p-8k/smoke/all-backends
          env:
            - name: HF_HOME
              value: /mnt/results/yourname-santapp-ruler/santapp-ruler-default-2tasks-6methods-100p-8k/cache/huggingface
            - name: HF_HUB_CACHE
              value: /mnt/results/yourname-santapp-ruler/santapp-ruler-default-2tasks-6methods-100p-8k/cache/huggingface/hub
            - name: HF_DATASETS_CACHE
              value: /mnt/results/yourname-santapp-ruler/santapp-ruler-default-2tasks-6methods-100p-8k/cache/huggingface/datasets
            - name: HF_HUB_OFFLINE
              value: "1"
            - name: TRANSFORMERS_OFFLINE
              value: "1"
            - name: HF_DATASETS_OFFLINE
              value: "1"
            - name: HF_HUB_DISABLE_XET
              value: "1"
            - name: TOKENIZERS_PARALLELISM
              value: "false"
            - name: OMP_NUM_THREADS
              value: "2"
            - name: MKL_NUM_THREADS
              value: "2"
            - name: CUDA_MODULE_LOADING
              value: LAZY
          resources:
            requests:
              cpu: "2"
              memory: 8Gi
              ephemeral-storage: 4Gi
              nvidia.com/gpu: "1"
            limits:
              cpu: "2"
              memory: 8Gi
              ephemeral-storage: 4Gi
              nvidia.com/gpu: "1"
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
          volumeMounts:
            - name: results-vol
              mountPath: /mnt/results
            - name: dshm
              mountPath: /dev/shm
      volumes:
        - name: results-vol
          persistentVolumeClaim:
            claimName: yourname-santapp-ruler-rwx
        - name: dshm
          emptyDir:
            medium: Memory
            sizeLimit: 2Gi
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: kubernetes.io/arch
                    operator: In
                    values: [amd64]
                  - key: nvidia.com/gpu.product
                    operator: In
                    values:
                      - Tesla-V100-SXM2-16GB
                      - Tesla-V100-PCIE-16GB
                      - NVIDIA-RTX-A4000
                  - key: nvidia.com/gpu.sharing-strategy
                    operator: In
                    values: [none]
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              preference:
                matchExpressions:
                  - key: topology.kubernetes.io/region
                    operator: In
                    values: [us-west]
      tolerations:
        - key: nvidia.com/gpu
          operator: Exists
          effect: PreferNoSchedule
