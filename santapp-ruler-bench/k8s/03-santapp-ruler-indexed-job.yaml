apiVersion: batch/v1
kind: Job
metadata:
  name: yourname-santapp-ruler-sweep
  namespace: ucsb-opus-lab
  labels:
    app.kubernetes.io/name: yourname-santapp-ruler
    app.kubernetes.io/component: benchmark
    app.kubernetes.io/part-of: santapp-ruler-default-2tasks-6methods-100p-8k
    owner: yourname
spec:
  completionMode: Indexed
  completions: 12
  parallelism: 5
  backoffLimitPerIndex: 2
  backoffLimit: 20
  maxFailedIndexes: 3
  ttlSecondsAfterFinished: 604800
  podFailurePolicy:
    rules:
      - action: Ignore
        onPodConditions:
          - type: DisruptionTarget
      - action: FailIndex
        onExitCodes:
          containerName: worker
          operator: In
          values: [42]
  template:
    metadata:
      labels:
        app.kubernetes.io/name: yourname-santapp-ruler
        app.kubernetes.io/component: benchmark
        app.kubernetes.io/part-of: santapp-ruler-default-2tasks-6methods-100p-8k
        owner: yourname
    spec:
      restartPolicy: Never
      terminationGracePeriodSeconds: 120
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: worker
          image: your-registry/santapp-ruler:latest
          imagePullPolicy: Always
          command: [python, /workspace/scripts/k8s_run_index.py]
          args:
            - --matrix
            - /workspace/k8s/matrices/default-2tasks-6methods-100p-8k.yaml
            - --results-root
            - /mnt/results/yourname-santapp-ruler
          env:
            - name: RESULTS_ROOT
              value: /mnt/results/yourname-santapp-ruler
            - name: HF_HOME
              value: /mnt/results/yourname-santapp-ruler/santapp-ruler-default-2tasks-6methods-100p-8k/cache/huggingface
            - name: HF_HUB_CACHE
              value: /mnt/results/yourname-santapp-ruler/santapp-ruler-default-2tasks-6methods-100p-8k/cache/huggingface/hub
            - name: HF_DATASETS_CACHE
              value: /mnt/results/yourname-santapp-ruler/santapp-ruler-default-2tasks-6methods-100p-8k/cache/huggingface/datasets
            - name: JOB_COMPLETION_INDEX
              valueFrom:
                fieldRef:
                  fieldPath: metadata.annotations['batch.kubernetes.io/job-completion-index']
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: POD_UID
              valueFrom:
                fieldRef:
                  fieldPath: metadata.uid
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
            - name: JOB_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.labels['batch.kubernetes.io/job-name']
            - name: CONTAINER_IMAGE
              value: your-registry/santapp-ruler:latest
            - name: HF_HUB_OFFLINE
              value: "1"
            - name: TRANSFORMERS_OFFLINE
              value: "1"
            - name: HF_DATASETS_OFFLINE
              value: "1"
            - name: HF_HUB_DISABLE_XET
              value: "1"
            - name: TOKENIZERS_PARALLELISM
              value: "false"
            - name: OMP_NUM_THREADS
              value: "2"
            - name: MKL_NUM_THREADS
              value: "2"
            - name: CUDA_MODULE_LOADING
              value: LAZY
          resources:
            requests:
              cpu: "2"
              memory: 8Gi
              ephemeral-storage: 4Gi
              nvidia.com/gpu: "1"
            limits:
              cpu: "2"
              memory: 8Gi
              ephemeral-storage: 4Gi
              nvidia.com/gpu: "1"
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
          volumeMounts:
            - name: results-vol
              mountPath: /mnt/results
            - name: dshm
              mountPath: /dev/shm
      volumes:
        - name: results-vol
          persistentVolumeClaim:
            claimName: yourname-santapp-ruler-rwx
        - name: dshm
          emptyDir:
            medium: Memory
            sizeLimit: 2Gi
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: kubernetes.io/arch
                    operator: In
                    values: [amd64]
                  - key: nvidia.com/gpu.product
                    operator: In
                    values:
                      - Tesla-V100-SXM2-16GB
                      - Tesla-V100-PCIE-16GB
                      - NVIDIA-RTX-A4000
                  - key: nvidia.com/gpu.sharing-strategy
                    operator: In
                    values: [none]
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              preference:
                matchExpressions:
                  - key: topology.kubernetes.io/region
                    operator: In
                    values: [us-west]
      topologySpreadConstraints:
        - maxSkew: 2
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: yourname-santapp-ruler
              app.kubernetes.io/component: benchmark
      tolerations:
        - key: nvidia.com/gpu
          operator: Exists
          effect: PreferNoSchedule
