schema_version: 1
experiment: santapp-ruler-default-2tasks-6methods-100p-8k
description: Shareable template with six attention methods on two 8k RULER tasks.
base_config: configs/k8s_default_8k.yaml
prompts_per_task: 100
tasks:
  - niah_multiquery
  - niah_multivalue
settings:
  - name: sdpa
    backend: sdpa
    description: Dense PyTorch SDPA baseline.
  - name: santa-s128
    backend: santa
    samples_per_head: 128
    description: Standalone SANTA with 128 IID token samples per query head.
  - name: santapp-b16-s128
    backend: santapp
    mode: guided
    samples_per_head: 128
    group_size: 16
    probe_queries: 64
    description: Centroid-guided SANTA++ with B=16 and S=128.
  - name: santapp-gumbel-b16-s128
    backend: santapp_gumbel_topk
    mode: gumbel_cluster
    samples_per_head: 128
    group_size: 16
    probe_queries: 64
    description: Gumbel Top-K SANTA++ selecting eight whole B=16 parents.
  - name: team-sampler-p16-r4-s128
    backend: team_sampler
    mode: team_sampler
    samples_per_head: 128
    parent_size: 16
    representatives_per_parent: 4
    probe_queries: 64
    description: Hierarchical team sampling with P=16, R=4, and S=128.
  - name: team-gumbel-p16-r4-s128
    backend: team_gumbel_topk
    mode: team_gumbel_topk
    samples_per_head: 128
    parent_size: 16
    representatives_per_parent: 4
    probe_queries: 64
    description: Gumbel Top-K whole-team sampling with P=16, R=4, and S=128.
