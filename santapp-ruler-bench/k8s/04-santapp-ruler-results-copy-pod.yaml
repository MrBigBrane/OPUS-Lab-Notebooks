apiVersion: v1
kind: Pod
metadata:
  name: yourname-santapp-ruler-results-copy
  namespace: ucsb-opus-lab
  labels:
    app.kubernetes.io/name: yourname-santapp-ruler
    app.kubernetes.io/component: copy
    app.kubernetes.io/part-of: santapp-ruler-default-2tasks-6methods-100p-8k
    owner: yourname
spec:
  restartPolicy: Never
  terminationGracePeriodSeconds: 10
  securityContext:
    runAsNonRoot: true
    runAsUser: 10001
    runAsGroup: 10001
    fsGroup: 10001
    fsGroupChangePolicy: OnRootMismatch
    seccompProfile:
      type: RuntimeDefault
  containers:
    - name: copy
      image: your-registry/santapp-ruler:latest
      imagePullPolicy: Always
      command: [/bin/bash, -lc]
      args:
        - |
          set -euo pipefail
          rm -rf /export/*
          python /workspace/scripts/k8s_export_results.py \
            --matrix /workspace/k8s/matrices/default-2tasks-6methods-100p-8k.yaml \
            --results-root /mnt/results/yourname-santapp-ruler \
            --output-dir /export \
            --allow-partial
          echo "Compact exports ready under /export; prompts and caches are excluded."
          ls -lah /export
          sleep infinity
      env:
        - name: RESULTS_ROOT
          value: /mnt/results/yourname-santapp-ruler
        - name: EXPORT_ROOT
          value: /export
      resources:
        requests:
          cpu: "1"
          memory: 2Gi
          ephemeral-storage: 2Gi
        limits:
          cpu: "1"
          memory: 2Gi
          ephemeral-storage: 2Gi
      securityContext:
        allowPrivilegeEscalation: false
        capabilities:
          drop: [ALL]
      volumeMounts:
        - name: results-vol
          mountPath: /mnt/results
          readOnly: true
        - name: export-vol
          mountPath: /export
  volumes:
    - name: results-vol
      persistentVolumeClaim:
        claimName: yourname-santapp-ruler-rwx
        readOnly: true
    - name: export-vol
      emptyDir:
        sizeLimit: 2Gi
  affinity:
    nodeAffinity:
      requiredDuringSchedulingIgnoredDuringExecution:
        nodeSelectorTerms:
          - matchExpressions:
              - key: kubernetes.io/arch
                operator: In
                values: [amd64]
              - key: topology.kubernetes.io/region
                operator: In
                values: [us-west]
