[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "santapp-ruler"
version = "1.5.0"
description = "RULER harness for SDPA, SANTA, and K-means or contiguous-parent SANTA++ attention"
readme = "README.md"
requires-python = ">=3.11,<3.13"
license = "Apache-2.0"
authors = [{name = "Research contributors"}]
dependencies = [
  "transformers==5.12.1",
  "datasets>=4.0,<5",
  "numpy>=2.0,<2.5",
  "PyYAML>=6.0,<7",
  "tqdm>=4.66,<5",
  "safetensors>=0.5,<1",
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "ruff>=0.12,<1"]
plot = ["matplotlib>=3.9,<4"]

[project.scripts]
santapp-ruler = "santapp_ruler.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
markers = ["gpu: requires actual CUDA kernel execution"]

[tool.ruff]
line-length = 96
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
