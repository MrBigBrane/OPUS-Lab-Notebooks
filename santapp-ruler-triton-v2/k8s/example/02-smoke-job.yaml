apiVersion: batch/v1
kind: Job
metadata:
  name: researcher-one-santa-ruler-smoke
  namespace: ucsb-opus-lab
  labels: &id001
    app.kubernetes.io/name: santa-ruler
    benchmark-owner: researcher-one
spec:
  completionMode: Indexed
  completions: 8
  parallelism: 4
  backoffLimit: 1
  template:
    metadata:
      labels: *id001
    spec:
      restartPolicy: Never
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        fsGroupChangePolicy: OnRootMismatch
      initContainers:
      - name: prepare-shared-permissions
        image: registry.example/project/santapp-ruler:r005-ampere
        imagePullPolicy: IfNotPresent
        command:
        - bash
        - -lc
        args:
        - set -euo pipefail; mkdir -p /shared/results /shared/hf; chown 10001:10001
          /shared/results /shared/hf; chmod 2775 /shared/results /shared/hf; ls -ld
          /shared /shared/results /shared/hf
        securityContext:
          runAsNonRoot: false
          runAsUser: 0
          runAsGroup: 0
          allowPrivilegeEscalation: false
        resources:
          requests:
            cpu: 50m
            memory: 32Mi
          limits:
            cpu: 50m
            memory: 32Mi
        volumeMounts:
        - name: shared
          mountPath: /shared
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
            - matchExpressions:
              - key: nvidia.com/gpu.product
                operator: In
                values:
                - NVIDIA-A10
                - NVIDIA-RTX-A5000
                - NVIDIA-GeForce-RTX-3090
                - NVIDIA-GeForce-RTX-4090
                - NVIDIA-RTX-A6000
                - NVIDIA-A40
                - NVIDIA-L40
                - NVIDIA-L40S
                - NVIDIA-A100-PCIE-40GB
                - NVIDIA-A100-SXM4-40GB
                - NVIDIA-A100-80GB-PCIe
                - NVIDIA-H100-80GB-HBM3
      containers:
      - name: benchmark
        image: registry.example/project/santapp-ruler:r005-ampere
        imagePullPolicy: IfNotPresent
        workingDir: /workspace
        command:
        - python
        args:
        - /workspace/scripts/k8s_run_index.py
        - --config
        - /config/smoke.yaml
        env:
        - name: OWNER_SLUG
          value: researcher-one
        - name: RESULTS_ROOT
          value: /shared/results
        - name: SMOKE_CONTEXTS
          value: 8192,32768
        - name: SMOKE_BACKENDS
          value: sdpa,santa,santapp,hierarchical
        - name: SMOKE_TASKS
          value: niah_single_1,niah_single_2,niah_single_3,niah_multikey_1,niah_multikey_2,niah_multikey_3,niah_multivalue,niah_multiquery,vt,cwe,fwe,qa_1,qa_2
        - name: HF_HOME
          value: /shared/hf
        - name: HF_DATASETS_CACHE
          value: /shared/hf/datasets
        - name: SMOKE_PREFILL_BACKEND
          value: triton
        - name: SMOKE_PROMPTS_PER_TASK
          value: '1'
        - name: TRITON_CACHE_DIR
          value: /tmp/santapp-runtime/triton
        - name: CUDA_CACHE_PATH
          value: /tmp/santapp-runtime/cuda
        - name: TMPDIR
          value: /tmp/santapp-runtime
        - name: PYTORCH_CUDA_ALLOC_CONF
          value: expandable_segments:True
        resources:
          requests:
            cpu: '4'
            memory: 32Gi
            nvidia.com/gpu: 1
          limits:
            cpu: '4'
            memory: 32Gi
            nvidia.com/gpu: 1
        volumeMounts:
        - name: jit-scratch
          mountPath: /tmp/santapp-runtime
        - name: shared
          mountPath: /shared
        - name: config
          mountPath: /config
          readOnly: true
      volumes:
      - name: jit-scratch
        emptyDir: {}
      - name: shared
        persistentVolumeClaim:
          claimName: researcher-one-santa-ruler-pvc
      - name: config
        configMap:
          name: researcher-one-santa-ruler-config
