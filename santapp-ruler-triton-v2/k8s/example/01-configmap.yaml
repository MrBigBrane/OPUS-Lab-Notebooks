apiVersion: v1
kind: ConfigMap
metadata:
  name: researcher-one-santa-ruler-config
  namespace: ucsb-opus-lab
  labels:
    app.kubernetes.io/name: santa-ruler
    benchmark-owner: researcher-one
data:
  smoke.yaml: "# The Kubernetes/local indexed runner overrides context, task, backend,\
    \ and run directory.\n# All algorithmic defaults are inherited from this file.\n\
    model:\n  name: Qwen/Qwen2.5-7B-Instruct\n  revision: a09a35458c702b33eeacc393d103063234e8bc28\n\
    \  dtype: float16\n  device: cuda\n  attn_implementation: sdpa\n  prompt_format:\
    \ chat_template\nbenchmark:\n  context_length: 8192\n  tasks: [niah_single_1]\n\
    \  prompts_per_task: 1\n  selection_seed: 42\n  data:\n    source: huggingface\n\
    \    repository: auto\n    revision: main\ngeneration:\n  backends: [sdpa]\n \
    \ stop_on_eos: true\n  max_new_tokens: null\n  random_seed: 0\nsanta:\n  samples_per_head:\
    \ 128\nsantapp:\n  prefill_backend: triton\n  parent_size: 16\n  representatives_per_parent:\
    \ 4\n  samples_per_head: 128\n  kmeans:\n    batch_size: 4096\n    n_init: 1\n\
    \    max_iter: 100\n    tol: 0.0\n    max_no_improvement: 10\n    init_size: null\n\
    \    reassignment_ratio: 0.01\n    random_state: 0\n\n# Contiguous-parent ablation:\
    \ fixed positional spans, then the same actual-key\n# teams and whole-team Gumbel\
    \ Top-K sampling.\nhierarchical:\n  prefill_backend: triton\n  parent_size: 16\n\
    \  representatives_per_parent: 4\n  samples_per_head: 128\ngrading:\n  bootstrap_resamples:\
    \ 1000\n  confidence_level: 0.95\n  bootstrap_seed: 20260903\noutput:\n  root:\
    \ /results\n  resume: true\n  save_full_prompts: false\n  save_prediction_inputs:\
    \ false\n"
