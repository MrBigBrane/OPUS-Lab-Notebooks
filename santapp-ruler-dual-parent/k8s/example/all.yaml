apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: researcher-santa-ruler-pvc
  namespace: ucsb-opus-lab
  labels:
    app.kubernetes.io/name: santa-ruler
    benchmark-owner: researcher
spec:
  accessModes:
  - ReadWriteMany
  storageClassName: rook-cephfs
  resources:
    requests:
      storage: 50Gi
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: researcher-santa-ruler-config
  namespace: ucsb-opus-lab
  labels:
    app.kubernetes.io/name: santa-ruler
    benchmark-owner: researcher
data:
  smoke.yaml: "# The Kubernetes/local indexed runner overrides context, task, backend,\
    \ and run directory.\n# All algorithmic defaults are inherited from this file.\n\
    model:\n  name: Qwen/Qwen2.5-7B-Instruct\n  revision: a09a35458c702b33eeacc393d103063234e8bc28\n\
    \  dtype: float16\n  device: cuda\n  attn_implementation: sdpa\n  prompt_format:\
    \ chat_template\nbenchmark:\n  context_length: 8192\n  tasks: [niah_single_1]\n\
    \  prompts_per_task: 1\n  selection_seed: 42\n  data:\n    source: huggingface\n\
    \    repository: auto\n    revision: main\ngeneration:\n  backends: [sdpa]\n \
    \ stop_on_eos: true\n  max_new_tokens: null\n  random_seed: 0\nsanta:\n  samples_per_head:\
    \ 128\nsantapp:\n  parent_size: 16\n  representatives_per_parent: 4\n  samples_per_head:\
    \ 128\n  kmeans:\n    batch_size: 4096\n    n_init: 1\n    max_iter: 100\n   \
    \ tol: 0.0\n    max_no_improvement: 10\n    init_size: null\n    reassignment_ratio:\
    \ 0.01\n    random_state: 0\n\n# Contiguous-parent ablation: fixed positional\
    \ spans, then the same actual-key\n# teams and whole-team Gumbel Top-K sampling.\n\
    hierarchical:\n  parent_size: 16\n  representatives_per_parent: 4\n  samples_per_head:\
    \ 128\ngrading:\n  bootstrap_resamples: 1000\n  confidence_level: 0.95\n  bootstrap_seed:\
    \ 20260903\noutput:\n  root: /results\n  resume: true\n  save_full_prompts: false\n\
    \  save_prediction_inputs: false\n"
---
apiVersion: batch/v1
kind: Job
metadata:
  name: researcher-santa-ruler-smoke
  namespace: ucsb-opus-lab
  labels: &id001
    app.kubernetes.io/name: santa-ruler
    benchmark-owner: researcher
spec:
  completionMode: Indexed
  completions: 8
  parallelism: 1
  backoffLimit: 1
  template:
    metadata:
      labels: *id001
    spec:
      restartPolicy: Never
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        fsGroupChangePolicy: OnRootMismatch
      initContainers:
      - name: prepare-shared-permissions
        image: registry.example/research/santapp-ruler:dual-parent-v1
        imagePullPolicy: IfNotPresent
        command:
        - bash
        - -lc
        args:
        - set -euo pipefail; mkdir -p /shared/results /shared/hf; chown 10001:10001
          /shared/results /shared/hf; chmod 2775 /shared/results /shared/hf; ls -ld
          /shared /shared/results /shared/hf
        securityContext:
          runAsNonRoot: false
          runAsUser: 0
          runAsGroup: 0
          allowPrivilegeEscalation: false
        volumeMounts:
        - name: shared
          mountPath: /shared
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
            - matchExpressions:
              - key: nvidia.com/gpu.product
                operator: In
                values:
                - NVIDIA-A10
                - NVIDIA-RTX-A5000
                - NVIDIA-GeForce-RTX-3090
                - NVIDIA-GeForce-RTX-4090
                - NVIDIA-TITAN-RTX
                - Quadro-RTX-6000
                - NVIDIA-RTX-A6000
                - NVIDIA-A40
                - NVIDIA-L40
                - NVIDIA-L40S
                - NVIDIA-A100-PCIE-40GB
                - NVIDIA-A100-SXM4-40GB
                - NVIDIA-A100-80GB-PCIe
                - NVIDIA-H100-80GB-HBM3
      containers:
      - name: benchmark
        image: registry.example/research/santapp-ruler:dual-parent-v1
        imagePullPolicy: IfNotPresent
        workingDir: /workspace
        command:
        - python
        args:
        - /workspace/scripts/k8s_run_index.py
        - --config
        - /config/smoke.yaml
        env:
        - name: OWNER_SLUG
          value: researcher
        - name: RESULTS_ROOT
          value: /shared/results
        - name: SMOKE_CONTEXTS
          value: 8192,32768
        - name: SMOKE_BACKENDS
          value: sdpa,santa,santapp,hierarchical
        - name: SMOKE_TASKS
          value: niah_single_1,niah_single_2,niah_single_3,niah_multikey_1,niah_multikey_2,niah_multikey_3,niah_multivalue,niah_multiquery,vt,cwe,fwe,qa_1,qa_2
        - name: HF_HOME
          value: /shared/hf
        - name: HF_DATASETS_CACHE
          value: /shared/hf/datasets
        resources:
          requests:
            cpu: '4'
            memory: 32Gi
            nvidia.com/gpu: 1
          limits:
            cpu: '12'
            memory: 64Gi
            nvidia.com/gpu: 1
        volumeMounts:
        - name: shared
          mountPath: /shared
        - name: config
          mountPath: /config
          readOnly: true
      volumes:
      - name: shared
        persistentVolumeClaim:
          claimName: researcher-santa-ruler-pvc
      - name: config
        configMap:
          name: researcher-santa-ruler-config
---
apiVersion: v1
kind: Pod
metadata:
  name: researcher-santa-ruler-copy
  namespace: ucsb-opus-lab
  labels:
    app.kubernetes.io/name: santa-ruler
    benchmark-owner: researcher
spec:
  restartPolicy: Never
  securityContext:
    runAsNonRoot: true
    runAsUser: 10001
    runAsGroup: 10001
    fsGroup: 10001
    fsGroupChangePolicy: OnRootMismatch
  containers:
  - name: copy
    image: registry.example/research/santapp-ruler:dual-parent-v1
    imagePullPolicy: IfNotPresent
    command:
    - bash
    - -lc
    args:
    - echo 'Results mounted at /shared/results'; sleep infinity
    resources:
      requests:
        cpu: 100m
        memory: 256Mi
      limits:
        cpu: '1'
        memory: 1Gi
    volumeMounts:
    - name: shared
      mountPath: /shared
  volumes:
  - name: shared
    persistentVolumeClaim:
      claimName: researcher-santa-ruler-pvc
