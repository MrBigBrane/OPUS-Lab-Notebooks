model:
  name: Qwen/Qwen2.5-7B-Instruct
  revision: a09a35458c702b33eeacc393d103063234e8bc28
  dtype: float16
  device: cuda
  attn_implementation: sdpa
  prompt_format: chat_template

benchmark:
  context_length: 33000
  tasks: [longbench_v2_cot]
  prompts_per_task: null
  selection_seed: 42
  data:
    source: huggingface
    repository: auto
    revision: main

generation:
  backends: [santapp, hierarchical]
  stop_on_eos: true
  max_new_tokens: null
  random_seed: 0

# k-means clustering on keys: global MiniBatchKMeans parents in raw post-RoPE key space
santapp:
  parent_size: 16
  representatives_per_parent: 4
  samples_per_head: 128
  kmeans:
    batch_size: 4096
    n_init: 1
    max_iter: 100
    tol: 0.0
    max_no_improvement: 10
    init_size: null
    reassignment_ratio: 0.01
    random_state: 0

# Contiguous span clusters: fixed positional spans
hierarchical:
  parent_size: 16
  representatives_per_parent: 4
  samples_per_head: 128

grading:
  bootstrap_resamples: 1000
  confidence_level: 0.95
  bootstrap_seed: 20260903

output:
  root: /results
  resume: true
  save_full_prompts: false
  save_prediction_inputs: false